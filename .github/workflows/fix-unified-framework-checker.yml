name: Fix Unified Framework Checker

on:
  push:
    branches:
      - refactor/unified-runtime-capabilities

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[unified-framework-checker]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix stable framework checker
        run: python tools/fix_unified_framework_checker.py
      - name: Commit checker fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No checker changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate_native_contract.py
          git commit -m "test: validate unified framework resolution [unified-framework-checker]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
