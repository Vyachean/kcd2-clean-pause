name: Apply HUD mask transaction

on:
  push:
    branches: [fix/instant-clean-pause-hud]
    paths: [.github/workflows/apply-hud-mask-transaction.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instant-clean-pause-hud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/apply_hud_mask_transaction.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate_native_contract.py
      - run: cmake -S native -B native/build -A x64
      - run: cmake --build native/build --config Release --parallel
      - name: Commit tested transaction
        shell: pwsh
        run: |
          git rm tools/apply_hud_mask_transaction.py .github/workflows/apply-hud-mask-transaction.yml
          git add native/src/clean_pause_native.cpp tests/test_hud_mask_transaction_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve HUD within vanilla mask transition"
          git push origin HEAD:fix/instant-clean-pause-hud
