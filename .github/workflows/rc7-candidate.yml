name: RC7e HUD child snapshot candidate

on:
  push:
    branches:
      - candidate/rc7-render-suppression
    paths:
      - native/candidate/rc7/**
      - native/src/clean_pause_native.h
      - native/src/kcd2_abi.h
      - native/src/version_proxy.cpp
      - native/src/version.def
      - VERSION
      - docs/RC7_SINGLE_SESSION_TEST.md
      - docs/RELEASE_RC7E.md
      - docs/RETAIL_EVIDENCE_RC7D.md
      - docs/STATUS_AND_PLAN.md
      - docs/REJECTED_HYPOTHESES.md
      - .github/workflows/rc7-candidate.yml
  pull_request:
    paths:
      - native/candidate/rc7/**
      - native/src/clean_pause_native.h
      - native/src/kcd2_abi.h
      - native/src/version_proxy.cpp
      - native/src/version.def
      - VERSION
      - docs/RC7_SINGLE_SESSION_TEST.md
      - docs/RELEASE_RC7E.md
      - docs/RETAIL_EVIDENCE_RC7D.md
      - docs/STATUS_AND_PLAN.md
      - docs/REJECTED_HYPOTHESES.md
      - .github/workflows/rc7-candidate.yml
  workflow_dispatch:

concurrency:
  group: rc7-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CANDIDATE_TAG: v0.1.0-rc.7e
  CANDIDATE_ASSET: kcd2-clean-pause-v0.1.0-rc.7e.zip

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify candidate safety contract
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          generated = Path("native/candidate/rc7/clean_pause_candidate_rc7e.ci.cpp")
          subprocess.run([
              sys.executable,
              "native/candidate/rc7/generate_candidate_v4.py",
              "native/candidate/rc7/clean_pause_candidate.cpp",
              str(generated),
          ], check=True)
          source = generated.read_text(encoding="utf-8")
          abi = Path("native/src/kcd2_abi.h").read_text(encoding="utf-8")

          forbidden = (
              "PauseGame(",
              'IsFilterEnabled("only_ui")',
              "ActionMapManager.InitActionMaps(",
              "ActionMapManager.LoadFromXML(",
              "ActionMapManager.EnableActionFilter(",
              "Player.OnAction =",
              "0x492D7F8",
              "0x549D388",
              "SetHudGateVisible",
              "g_hudGateForcedVisible",
              "HookHudSetVisible",
              "HookGlobalHudVisibility",
              "EnsureGlobalHudVisibilityHook",
              "kHudElementSetVisibleSlot",
          )
          for needle in forbidden:
              if needle in source:
                  raise SystemExit(f"Forbidden rc7e candidate path: {needle}")

          required = (
              'getElement(g_flashUI, "Menu@0")',
              "kUIElementRenderSlot = 24",
              "kUIElementIsVisibleSlot",
              "HookMenuRender",
              'getElement(g_flashUI, "hud@0")',
              "kUIElementCallFunctionByNameSlot = 69",
              "HookHudCallFunction",
              'std::strcmp(name, "ClearSubtitles") == 0',
              'std::strcmp(name, "HideNarrativeSubtitles") == 0',
              "kHudClipCount = 28",
              '"Subtitles"',
              '"Hints"',
              "kUIElementGetMovieClipByNameSlot",
              "kFlashVariableGetDisplayInfoSlot",
              "kFlashVariableSetVisibleSlot",
              "CaptureHudClipSnapshot",
              "RestoreHudClipSnapshot",
              "ReleaseHudClipSnapshot",
              "HUD child visibility snapshot captured for all 28 clips",
              "Clean Pause HUD child snapshot restored across all 28 clips",
              "kHudSnapshotHoldMs = 750",
              "ReplayVanillaPauseToggle",
              "Clean Pause -> running via B using replayed vanilla pause toggle",
              "g_forwardDepth",
              "if (g_forwardDepth != 0)",
              "rc7e child-HUD-snapshot render-suppression candidate active",
          )
          for needle in required:
              if needle not in source:
                  raise SystemExit(f"Missing rc7e candidate contract: {needle}")

          for needle in (
              "XiStart = 516",
              "XiA = 526",
              "XiB = 527",
              "kUIElementGetMovieClipByNameSlot = 71",
              "kFlashVariableReleaseSlot = 0",
              "kFlashVariableGetDisplayInfoSlot = 26",
              "kFlashVariableSetVisibleSlot = 33",
          ):
              if needle not in abi:
                  raise SystemExit(f"Missing retail/RE-proven ABI contract: {needle}")

          # The 28-name table must be a complete one-to-one snapshot, not a small
          # whitelist that could accidentally preserve subtitles while losing hints.
          table_start = source.index("const char* const kHudClipNames")
          table_end = source.index("};", table_start)
          table = source[table_start:table_end]
          if table.count('"') != 56:
              raise SystemExit("HUD child snapshot must name exactly 28 clips")

          capture = source[source.index("bool CaptureHudClipSnapshot"):source.index("bool RestoreHudClipSnapshot")]
          if "getMovieClip(hud, kHudClipNames[i], nullptr)" not in capture:
              raise SystemExit("HUD snapshot must resolve each child through hud@0 GetMovieClip")
          if "info[kFlashDisplayInfoVisibleOffset] != 0" not in capture:
              raise SystemExit("HUD snapshot must preserve pre-pause child visibility")

          restore = source[source.index("bool RestoreHudClipSnapshot"):source.index("void __fastcall HookMenuRender")]
          if "setVisible(snapshot.clip, snapshot.visible)" not in restore:
              raise SystemExit("HUD restore must replay captured visibility, not force every child visible")

          menu_hook = source[source.index("void __fastcall HookMenuRender"):source.index("bool EnsureMenuRenderHook")]
          if "RestoreHudClipSnapshot()" not in menu_hook:
              raise SystemExit("Menu render transition must hold the child snapshot across late HUD refreshes")
          if "g_originalRender(element);" not in menu_hook:
              raise SystemExit("Menu render hook must fail open / forward when not suppressing")

          freeze_fn = source[source.index("bool ShouldFreezeHudFunction"):source.index("bool __fastcall HookHudCallFunction")]
          if freeze_fn.count("std::strcmp(") != 2:
              raise SystemExit("Subtitle freeze whitelist must contain exactly two function-name comparisons")
          for allowed in ("ClearSubtitles", "HideNarrativeSubtitles"):
              if allowed not in freeze_fn:
                  raise SystemExit(f"Subtitle freeze whitelist missing {allowed}")

          b_start = source.index("if (key == KeyId::XiB) {", source.index("void HandleHiddenInput"))
          b_end = source.index("// Once a real Menu@0 render", b_start)
          b_block = source[b_start:b_end]
          if "ReplayVanillaPauseToggle" not in b_block:
              raise SystemExit("B must use the captured vanilla pause route")
          if "Forward(input, event, force);" in b_block:
              raise SystemExit("Physical B must not leak to gameplay/dialog/cutscene while Clean Pause owns input")

          print("rc7e child-HUD snapshot safety contract passed")

      - name: Configure x64 Release
        run: cmake -S native/candidate/rc7 -B native/candidate/rc7/build -A x64

      - name: Build x64 Release
        run: cmake --build native/candidate/rc7/build --config Release --parallel

      - name: Validate and package candidate
        shell: pwsh
        run: |
          $dll = "native/candidate/rc7/build/Release/version.dll"
          if (-not (Test-Path $dll)) { throw "Missing $dll" }
          if ((Get-Item $dll).Length -lt 10240) { throw "version.dll is unexpectedly small" }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vs) { throw "MSVC installation not found" }
          $dumpbin = Get-ChildItem (Join-Path $vs "VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe") |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found" }

          $exports = & $dumpbin /nologo /exports $dll | Out-String
          foreach ($name in @("GetFileVersionInfoW", "GetFileVersionInfoSizeW", "VerQueryValueW")) {
            if ($exports -notmatch [regex]::Escape($name)) {
              throw "version.dll proxy export missing: $name"
            }
          }

          $deps = & $dumpbin /nologo /dependents $dll | Out-String
          if ($deps -match "VCRUNTIME[0-9]+\.dll" -or $deps -match "MSVCP[0-9]+\.dll") {
            throw "Candidate DLL unexpectedly depends on dynamic MSVC runtime"
          }

          New-Item -ItemType Directory -Force candidate/stage | Out-Null
          Copy-Item $dll candidate/stage/version.dll
          Copy-Item docs/RC7_SINGLE_SESSION_TEST.md candidate/stage/TEST.md

          $asset = $env:CANDIDATE_ASSET
          Compress-Archive -Path candidate/stage/* -DestinationPath "candidate/$asset" -CompressionLevel Optimal
          $hash = (Get-FileHash "candidate/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content candidate/SHA256SUMS.txt -Encoding ascii -NoNewline

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: rc7e-child-hud-snapshot-candidate
          path: |
            candidate/${{ env.CANDIDATE_ASSET }}
            candidate/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-prerelease:
    if: github.event_name == 'push'
    needs: build-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download verified candidate
        uses: actions/download-artifact@v4
        with:
          name: rc7e-child-hud-snapshot-candidate
          path: release-artifact

      - name: Verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifact
          sha256sum --check SHA256SUMS.txt
          test -f "$CANDIDATE_ASSET"
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1

      - name: Publish canonical GitHub prerelease and bind exact tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="release-artifact/$CANDIDATE_ASSET"
          checksum="release-artifact/SHA256SUMS.txt"
          expected_tag="v$(tr -d '\r\n' < VERSION)"
          test "$expected_tag" = "$CANDIDATE_TAG"

          if gh release view "$CANDIDATE_TAG" >/dev/null 2>&1; then
            while IFS= read -r old_asset; do
              [[ -z "$old_asset" ]] && continue
              if [[ "$old_asset" == *.zip && "$old_asset" != "$CANDIDATE_ASSET" ]]; then
                gh release delete-asset "$CANDIDATE_TAG" "$old_asset" --yes
              fi
            done < <(gh release view "$CANDIDATE_TAG" --json assets --jq '.assets[].name')

            gh release upload "$CANDIDATE_TAG" "$asset" "$checksum" --clobber
            gh release edit "$CANDIDATE_TAG" \
              --title "$CANDIDATE_TAG — HUD child snapshot candidate" \
              --notes-file docs/RELEASE_RC7E.md \
              --prerelease
          else
            gh release create "$CANDIDATE_TAG" "$asset" "$checksum" \
              --target "$GITHUB_SHA" \
              --title "$CANDIDATE_TAG — HUD child snapshot candidate" \
              --notes-file docs/RELEASE_RC7E.md \
              --prerelease
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$CANDIDATE_TAG" "$GITHUB_SHA"
          git push origin "+refs/tags/$CANDIDATE_TAG:refs/tags/$CANDIDATE_TAG"

          remote_sha="$(git ls-remote --tags origin "refs/tags/$CANDIDATE_TAG" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

          assets="$(gh release view "$CANDIDATE_TAG" --json assets --jq '.assets[].name')"
          test "$(printf '%s\n' "$assets" | grep -Fx "$CANDIDATE_ASSET" | wc -l)" -eq 1
          test "$(printf '%s\n' "$assets" | grep -Fx 'SHA256SUMS.txt' | wc -l)" -eq 1
          test "$(printf '%s\n' "$assets" | grep -E '\.zip$' | wc -l)" -eq 1

          echo "Verified canonical prerelease $CANDIDATE_TAG -> $GITHUB_SHA"