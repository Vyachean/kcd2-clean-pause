name: RC7g production promotion

on:
  push:
    branches:
      - candidate/rc7-render-suppression
    paths:
      - .github/workflows/rc7-candidate.yml
      - native/candidate/rc7/**
  pull_request:
    paths:
      - .github/workflows/rc7-candidate.yml
      - native/candidate/rc7/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: github.repository == 'Vyachean/kcd2-clean-pause'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: candidate/rc7-render-suppression
          fetch-depth: 0

      - name: Materialize exact retail-proven source
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          out = Path('native/src/clean_pause_native.cpp')
          subprocess.run([
              sys.executable,
              'native/candidate/rc7/generate_candidate_v7.py',
              'native/candidate/rc7/clean_pause_candidate.cpp',
              str(out),
          ], check=True)

          source = out.read_text(encoding='utf-8')
          replacements = {
              'rc7g borrowed-movieclip child-HUD-snapshot candidate active':
                  'KCD2 Clean Pause v0.1.0 active',
              'native bootstrap started; target=KCD2 1.5.6 Windows retail; rc7g borrowed-movieclip child-HUD-snapshot candidate':
                  'native bootstrap started; target=KCD2 1.5.6 Windows retail; KCD2 Clean Pause v0.1.0',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'missing expected runtime marker: {old}')
              source = source.replace(old, new)

          for needle in (
              'HookMenuRender',
              'HookHudUpdate',
              'CaptureHudVisibilitySnapshot',
              'RestoreHudVisibilitySnapshot',
              'ClearSubtitles',
              'HideNarrativeSubtitles',
              'ReplayVanillaPauseToggle',
              'KCD2 Clean Pause v0.1.0 active',
          ):
              if needle not in source:
                  raise SystemExit(f'production source missing: {needle}')

          for needle in (
              'ActionMapManager.IsFilterEnabled("only_ui")',
              'HideVerifiedVanillaPause(',
              'ReleaseFlashVariable',
              'snapshot.clip',
              'rc7g borrowed-movieclip child-HUD-snapshot candidate active',
          ):
              if needle in source:
                  raise SystemExit(f'production source retained rejected path: {needle}')

          out.write_text(source, encoding='utf-8')

      - name: Configure production x64 Release
        run: cmake -S native -B native/build -A x64

      - name: Build production x64 Release
        run: cmake --build native/build --config Release --parallel

      - name: Commit production source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- native/src/clean_pause_native.cpp; then
            echo 'Production source already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/clean_pause_native.cpp
          git commit -m 'feat(native): promote retail-proven clean pause implementation'
          git push origin HEAD:candidate/rc7-render-suppression
