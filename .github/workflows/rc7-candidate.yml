name: RC7g source materialization

on:
  push:
    branches:
      - candidate/rc7-render-suppression
    paths:
      - .github/workflows/rc7-candidate.yml
      - native/candidate/rc7/**
  pull_request:
    paths:
      - .github/workflows/rc7-candidate.yml
      - native/candidate/rc7/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate exact rc7g source
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          out = Path('materialized/clean_pause_native.cpp')
          out.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run([
              sys.executable,
              'native/candidate/rc7/generate_candidate_v7.py',
              'native/candidate/rc7/clean_pause_candidate.cpp',
              str(out),
          ], check=True)

          source = out.read_text(encoding='utf-8')
          replacements = {
              'rc7g borrowed-movieclip child-HUD-snapshot candidate active':
                  'KCD2 Clean Pause v0.1.0 active',
              'native bootstrap started; target=KCD2 1.5.6 Windows retail; rc7g borrowed-movieclip child-HUD-snapshot candidate':
                  'native bootstrap started; target=KCD2 1.5.6 Windows retail; KCD2 Clean Pause v0.1.0',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'missing expected runtime marker: {old}')
              source = source.replace(old, new)

          required = (
              'HookMenuRender',
              'HookHudUpdate',
              'CaptureHudVisibilitySnapshot',
              'RestoreHudVisibilitySnapshot',
              'ShouldFreezeHudFunction',
              'ClearSubtitles',
              'HideNarrativeSubtitles',
              'ReplayVanillaPauseToggle',
              'KeyId::XiB',
              'KCD2 Clean Pause v0.1.0 active',
          )
          for needle in required:
              if needle not in source:
                  raise SystemExit(f'materialized source missing: {needle}')

          forbidden = (
              'ActionMapManager.IsFilterEnabled("only_ui")',
              'HideVerifiedVanillaPause(',
              'ReleaseFlashVariable',
              'snapshot.clip',
              'rc7g borrowed-movieclip child-HUD-snapshot candidate active',
          )
          for needle in forbidden:
              if needle in source:
                  raise SystemExit(f'materialized source retained rejected path: {needle}')

          out.write_text(source, encoding='utf-8')
          print(f'materialized {out} ({len(source)} chars)')

      - name: Configure candidate x64 Release
        run: cmake -S native/candidate/rc7 -B native/candidate/rc7/build -A x64

      - name: Build candidate x64 Release
        run: cmake --build native/candidate/rc7/build --config Release --parallel

      - name: Upload materialized production source
        uses: actions/upload-artifact@v4
        with:
          name: rc7g-materialized-production-source
          path: materialized/clean_pause_native.cpp
          if-no-files-found: error
          retention-days: 7
