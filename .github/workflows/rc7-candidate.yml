name: RC7g production promotion

on:
  push:
    branches:
      - candidate/rc7-render-suppression
    paths:
      - .github/workflows/rc7-candidate.yml
      - native/candidate/rc7/**
  pull_request:
    paths:
      - .github/workflows/rc7-candidate.yml
      - native/candidate/rc7/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: github.repository == 'Vyachean/kcd2-clean-pause'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: candidate/rc7-render-suppression
          fetch-depth: 0

      - name: Materialize retail-proven source and apply v0.1.0 contract
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          out = Path('native/src/clean_pause_native.cpp')
          subprocess.run([
              sys.executable,
              'native/candidate/rc7/generate_candidate_v7.py',
              'native/candidate/rc7/clean_pause_candidate.cpp',
              str(out),
          ], check=True)

          source = out.read_text(encoding='utf-8')

          replacements = {
              'rc7g borrowed-movieclip child-HUD-snapshot candidate active':
                  'KCD2 Clean Pause v0.1.0 active',
              'native bootstrap started; target=KCD2 1.5.6 Windows retail; rc7g borrowed-movieclip child-HUD-snapshot candidate':
                  'native bootstrap started; target=KCD2 1.5.6 Windows retail; KCD2 Clean Pause v0.1.0',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'missing expected runtime marker: {old}')
              source = source.replace(old, new)

          for line in (
              'InputEvent g_pausePressTemplate{};\n',
              'InputEvent g_pauseReleaseTemplate{};\n',
              'bool g_havePausePressTemplate{};\n',
              'bool g_havePauseReleaseTemplate{};\n',
          ):
              if source.count(line) != 1:
                  raise SystemExit(f'expected one replay-template declaration: {line!r}')
              source = source.replace(line, '', 1)

          replay_start = source.index('bool ReplayVanillaPauseToggle(void* input, bool force)\n{')
          replay_end = source.index('void ArmPendingPauseAttempt()', replay_start)
          source = source[:replay_start] + source[replay_end:]

          old_b = '''    if (key == KeyId::XiB) {\n        if (released)\n            return;\n        if (!pressed)\n            return;\n\n        if (!RestoreHudVisibilitySnapshot(g_vanillaPauseHudSnapshot, "vanilla-pause-before-B")) {\n            g_cleanHidden.store(false, std::memory_order_release);\n            g_renderSuppressionObserved.store(false, std::memory_order_release);\n            g_cleanHiddenSinceMs.store(0, std::memory_order_release);\n            ResetHudSnapshots();\n            g_swallowResumeRelease.store(true, std::memory_order_release);\n            Log("B resume aborted: vanilla-pause HUD snapshot restore failed; showing ordinary pause menu (fail-open)");\n            return;\n        }\n\n        if (ReplayVanillaPauseToggle(input, force)) {\n            g_cleanHidden.store(false, std::memory_order_release);\n            g_renderSuppressionObserved.store(false, std::memory_order_release);\n            g_cleanHiddenSinceMs.store(0, std::memory_order_release);\n            g_pendingPauseAttempt.store(false, std::memory_order_release);\n            g_pendingDeadlineMs.store(0, std::memory_order_release);\n            ResetHudSnapshots();\n            g_swallowResumeRelease.store(true, std::memory_order_release);\n            Log("Clean Pause -> running via B using replayed vanilla pause toggle");\n            return;\n        }\n        ClearHiddenState("B resume toggle was not verified; showing ordinary vanilla pause menu (fail-open)");\n        g_swallowResumeRelease.store(true, std::memory_order_release);\n        return;\n    }\n'''
          new_b = '''    if (key == KeyId::XiB) {\n        if (released)\n            return;\n        if (!pressed)\n            return;\n\n        if (!RestoreHudVisibilitySnapshot(g_vanillaPauseHudSnapshot, "vanilla-pause-visible-menu-via-B"))\n            Log("could not restore captured vanilla-pause HUD before showing Menu via B; continuing fail-open");\n\n        g_cleanHidden.store(false, std::memory_order_release);\n        g_renderSuppressionObserved.store(false, std::memory_order_release);\n        g_cleanHiddenSinceMs.store(0, std::memory_order_release);\n        g_pendingPauseAttempt.store(false, std::memory_order_release);\n        g_pendingDeadlineMs.store(0, std::memory_order_release);\n        ResetHudSnapshots();\n        g_swallowResumeRelease.store(true, std::memory_order_release);\n        Log("Clean Pause -> visible vanilla pause menu via B (v0.1.0 behavior)");\n        return;\n    }\n'''
          if source.count(old_b) != 1:
              raise SystemExit('could not locate rc7g direct-B replay block')
          source = source.replace(old_b, new_b, 1)

          old_capture = '''    if (IsPauseKey(key)) {\n        if (pressed) {\n            g_pausePressTemplate = *event;\n            g_havePausePressTemplate = true;\n            g_havePauseReleaseTemplate = false;\n        }\n        if (released && g_havePausePressTemplate\n            && g_pausePressTemplate.keyId == key) {\n            g_pauseReleaseTemplate = *event;\n            g_havePauseReleaseTemplate = true;\n        }\n    }\n\n'''
          if source.count(old_capture) != 1:
              raise SystemExit('could not locate replay-template capture block')
          source = source.replace(old_capture, '', 1)

          for needle in (
              'HookMenuRender',
              'HookHudUpdate',
              'CaptureHudVisibilitySnapshot',
              'RestoreHudVisibilitySnapshot',
              'ClearSubtitles',
              'HideNarrativeSubtitles',
              'Clean Pause -> visible vanilla pause menu via B (v0.1.0 behavior)',
              'KCD2 Clean Pause v0.1.0 active',
          ):
              if needle not in source:
                  raise SystemExit(f'production source missing: {needle}')

          for needle in (
              'ActionMapManager.IsFilterEnabled("only_ui")',
              'HideVerifiedVanillaPause(',
              'ReleaseFlashVariable',
              'snapshot.clip',
              'ReplayVanillaPauseToggle',
              'g_pausePressTemplate',
              'g_pauseReleaseTemplate',
              'g_havePausePressTemplate',
              'g_havePauseReleaseTemplate',
              'rc7g borrowed-movieclip child-HUD-snapshot candidate active',
          ):
              if needle in source:
                  raise SystemExit(f'production source retained rejected/experimental path: {needle}')

          out.write_text(source, encoding='utf-8')

      - name: Configure production x64 Release
        run: cmake -S native -B native/build -A x64

      - name: Build production x64 Release
        run: cmake --build native/build --config Release --parallel

      - name: Commit production source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- native/src/clean_pause_native.cpp; then
            echo 'Production source already matches the v0.1.0 contract.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/clean_pause_native.cpp
          git commit -m 'refactor(native): finalize stable clean pause behavior'
          git push origin HEAD:candidate/rc7-render-suppression
