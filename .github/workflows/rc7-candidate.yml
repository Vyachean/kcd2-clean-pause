name: RC7c HUD-preserving candidate

on:
  push:
    branches:
      - candidate/rc7-render-suppression
    paths:
      - native/candidate/rc7/**
      - native/src/clean_pause_native.h
      - native/src/kcd2_abi.h
      - native/src/version_proxy.cpp
      - native/src/version.def
      - docs/RC7_SINGLE_SESSION_TEST.md
      - docs/RELEASE_RC7C.md
      - docs/STATUS_AND_PLAN.md
      - docs/REJECTED_HYPOTHESES.md
      - docs/RETAIL_EVIDENCE_RC7C.md
      - .github/workflows/rc7-candidate.yml
  pull_request:
    paths:
      - native/candidate/rc7/**
      - native/src/clean_pause_native.h
      - native/src/kcd2_abi.h
      - native/src/version_proxy.cpp
      - native/src/version.def
      - docs/RC7_SINGLE_SESSION_TEST.md
      - .github/workflows/rc7-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_TAG: v0.1.0-rc.7c
  CANDIDATE_SLUG: rc7c-hud-preserving

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify candidate safety contract
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          generated = Path("native/candidate/rc7/clean_pause_candidate_rc7c.ci.cpp")
          subprocess.run([
              sys.executable,
              "native/candidate/rc7/generate_candidate_v2.py",
              "native/candidate/rc7/clean_pause_candidate.cpp",
              str(generated),
          ], check=True)
          source = generated.read_text(encoding="utf-8")

          forbidden = (
              "PauseGame(",
              "SetVisibleFn",
              "kUIElementSetVisibleSlot",
              'IsFilterEnabled("only_ui")',
              "ActionMapManager.InitActionMaps(",
              "ActionMapManager.LoadFromXML(",
              "ActionMapManager.EnableActionFilter(",
              "Player.OnAction =",
              "0x492D7F8",
              "0x549D388",
          )
          for needle in forbidden:
              if needle in source:
                  raise SystemExit(f"Forbidden rc7c candidate path: {needle}")

          required = (
              'getElement(g_flashUI, "Menu@0")',
              "kUIElementRenderSlot = 24",
              "kUIElementIsVisibleSlot",
              "HookMenuRender",
              "g_renderSuppressionObserved",
              "g_cleanHiddenSinceMs",
              "kRenderObservationGraceMs = 250",
              "kFlashUISetHudElementsVisibleSlot = 28",
              "SetHudGateVisible(true)",
              'getElement(g_flashUI, "hud@0")',
              "kUIElementCallFunctionByNameSlot = 69",
              "HookHudCallFunction",
              'std::strcmp(name, "ClearSubtitles") == 0',
              'std::strcmp(name, "HideNarrativeSubtitles") == 0',
              "ReplayVanillaPauseToggle",
              "g_pausePressTemplate",
              "g_pauseReleaseTemplate",
              "Clean Pause -> running via B using replayed vanilla pause toggle",
              "B resume toggle was not verified; showing ordinary vanilla pause menu (fail-open)",
              "second Escape/Start consumed; Render restored",
              "g_forwardDepth",
              "if (g_forwardDepth != 0)",
              "rc7c HUD-preserving render-suppression candidate active",
          )
          for needle in required:
              if needle not in source:
                  raise SystemExit(f"Missing rc7c candidate contract: {needle}")

          menu_hook = source[source.index("void __fastcall HookMenuRender"):source.index("bool EnsureMenuRenderHook")]
          if "g_originalRender(element);" not in menu_hook or "return;" not in menu_hook:
              raise SystemExit("Menu Render hook must suppress only hidden Menu@0 and forward all other renders")

          freeze_fn = source[source.index("bool ShouldFreezeHudFunction"):source.index("bool __fastcall HookHudCallFunction")]
          for allowed in ("ClearSubtitles", "HideNarrativeSubtitles"):
              if allowed not in freeze_fn:
                  raise SystemExit(f"Subtitle freeze whitelist missing {allowed}")
          if freeze_fn.count("std::strcmp(") != 2:
              raise SystemExit("Subtitle freeze whitelist must contain exactly two function-name comparisons")

          hud_hook = source[source.index("bool __fastcall HookHudCallFunction"):source.index("bool EnsureHudSubtitleHook")]
          if "ShouldFreezeHudFunction(functionName)" not in hud_hook:
              raise SystemExit("HUD hook must delegate suppression to the exact subtitle whitelist")
          if "g_originalHudCallFunction" not in hud_hook:
              raise SystemExit("HUD hook must forward non-subtitle Flash calls")

          b_start = source.index("if (key == KeyId::XiB) {", source.index("void HandleHiddenInput"))
          b_end = source.index("// Once a real Menu@0 render", b_start)
          b_block = source[b_start:b_end]
          if "ReplayVanillaPauseToggle" not in b_block:
              raise SystemExit("B must resume through the captured vanilla pause route")
          if "Forward(input, event, force);" in b_block:
              raise SystemExit("Physical B must not leak to dialog/cutscene/gameplay while Clean Pause owns input")

          print("rc7c safety contract passed")

      - name: Configure x64 Release
        run: cmake -S native/candidate/rc7 -B native/candidate/rc7/build -A x64

      - name: Build x64 Release
        run: cmake --build native/candidate/rc7/build --config Release --parallel

      - name: Validate and package candidate
        shell: pwsh
        run: |
          $dll = "native/candidate/rc7/build/Release/version.dll"
          if (-not (Test-Path $dll)) { throw "Missing $dll" }
          if ((Get-Item $dll).Length -lt 10240) { throw "version.dll is unexpectedly small" }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vs) { throw "MSVC installation not found" }
          $dumpbin = Get-ChildItem (Join-Path $vs "VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe") |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found" }

          $exports = & $dumpbin /nologo /exports $dll | Out-String
          foreach ($name in @("GetFileVersionInfoW", "GetFileVersionInfoSizeW", "VerQueryValueW")) {
            if ($exports -notmatch [regex]::Escape($name)) {
              throw "version.dll proxy export missing: $name"
            }
          }

          $deps = & $dumpbin /nologo /dependents $dll | Out-String
          if ($deps -match "VCRUNTIME[0-9]+\.dll" -or $deps -match "MSVCP[0-9]+\.dll") {
            throw "Candidate DLL unexpectedly depends on dynamic MSVC runtime"
          }

          New-Item -ItemType Directory -Force candidate/stage | Out-Null
          Copy-Item $dll candidate/stage/version.dll
          Copy-Item docs/RC7_SINGLE_SESSION_TEST.md candidate/stage/TEST.md

          $asset = "kcd2-clean-pause-$env:CANDIDATE_SLUG-$env:GITHUB_SHA.zip"
          Compress-Archive -Path candidate/stage/* -DestinationPath "candidate/$asset" -CompressionLevel Optimal
          $hash = (Get-FileHash "candidate/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content candidate/SHA256SUMS.txt -Encoding ascii -NoNewline

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: rc7c-hud-preserving-candidate
          path: |
            candidate/kcd2-clean-pause-rc7c-hud-preserving-*.zip
            candidate/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-prerelease:
    if: github.event_name == 'push'
    needs: build-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified candidate
        uses: actions/download-artifact@v4
        with:
          name: rc7c-hud-preserving-candidate
          path: release-artifact

      - name: Verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifact
          sha256sum --check SHA256SUMS.txt
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="$(find release-artifact -maxdepth 1 -type f -name '*.zip' -print -quit)"
          checksum="release-artifact/SHA256SUMS.txt"

          if gh release view "$CANDIDATE_TAG" >/dev/null 2>&1; then
            gh release upload "$CANDIDATE_TAG" "$asset" "$checksum" --clobber
            gh release edit "$CANDIDATE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$CANDIDATE_TAG — HUD-preserving candidate" \
              --notes-file docs/RELEASE_RC7C.md \
              --prerelease
          else
            gh release create "$CANDIDATE_TAG" "$asset" "$checksum" \
              --target "$GITHUB_SHA" \
              --title "$CANDIDATE_TAG — HUD-preserving candidate" \
              --notes-file docs/RELEASE_RC7C.md \
              --prerelease
          fi
