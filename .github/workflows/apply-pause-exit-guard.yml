name: Apply pause exit guard

on:
  push:
    branches:
      - fix/instant-clean-pause-hud
    paths:
      - tools/apply_pause_exit_guard.py
      - .github/workflows/apply-pause-exit-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instant-clean-pause-hud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python tools/apply_pause_exit_guard.py
      - name: Repository tests
        run: python -m unittest discover -s tests -v
      - name: Validate native contract
        run: python tools/validate_native_contract.py
      - name: Configure x64 Release
        run: cmake -S native -B native/build -A x64
      - name: Build x64 Release
        run: cmake --build native/build --config Release --parallel
      - name: Commit tested fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/clean_pause_native.cpp tests/test_hud_mask_transaction_contract.py
          git diff --cached --quiet; if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "fix: make Clean Pause exit single-step"
          git push origin HEAD:fix/instant-clean-pause-hud
