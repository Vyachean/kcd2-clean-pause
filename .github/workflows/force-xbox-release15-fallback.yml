name: Force Xbox Release15 Fallback

on:
  push:
    branches:
      - diag/force-release15-fallback-xbox

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message, '[force-xbox-fallback]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force Xbox fallback path
        run: python tools/force_xbox_release15_fallback.py
      - name: Commit diagnostic override
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No diagnostic changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/clean_pause_native.cpp
          git commit -m "diag: force Xbox through release_1_5 fallback [force-xbox-fallback]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
