name: Add Release15 Compatibility Fallback

on:
  push:
    branches:
      - feat/release15-compatibility-fallback

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message, '[release15-fallback]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add conservative release15 fallback
        run: python tools/add_release15_compatibility_fallback.py
      - name: Commit fallback implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No fallback changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/kcd2_runtime_profile.cpp native/src/clean_pause_native.cpp native/tests/runtime_profile_tests.cpp tests/test_runtime_profile_contract.py tools/validate_native_contract.py
          git commit -m "feat: add conservative release_1_5 compatibility fallback [release15-fallback]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
