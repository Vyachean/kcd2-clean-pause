name: PR34 transition scope correction

on:
  push:
    branches:
      - fix/instant-clean-pause-hud

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instant-clean-pause-hud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded correction
        run: python tools/_pr34_transition_scope_patch.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Validate native architecture contract
        run: python tools/validate_native_contract.py
      - name: Configure x64 Release
        run: cmake -S native -B native/build -A x64
      - name: Build x64 Release
        run: cmake --build native/build --config Release --parallel
      - name: Commit verified product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src tests tools/validate_native_contract.py docs CHANGELOG.md
          if (git diff --cached --quiet) { throw "Patch produced no product changes" }
          git commit -m "fix: scope HUD pinning to vanilla pause transition"
          git push origin HEAD:fix/instant-clean-pause-hud
