name: Promote Xbox Exact Roots

on:
  push:
    branches:
      - refactor/unified-runtime-capabilities

permissions:
  contents: write

jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message, '[xbox-exact-roots]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote captured Xbox runtime roots
        run: python tools/promote_xbox_exact_roots.py
      - name: Commit exact-root promotion
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No exact-root changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/kcd2_runtime_profile.h native/src/kcd2_runtime_profile.cpp native/src/clean_pause_native.cpp native/tests/runtime_profile_tests.cpp tests/test_pause_barrier_contract.py tests/test_runtime_profile_contract.py tools/validate_native_contract.py docs/DESIGN.md
          git commit -m "refactor: promote Xbox runtime roots to exact profile data [xbox-exact-roots]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
