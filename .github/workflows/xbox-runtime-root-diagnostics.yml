name: Xbox Runtime Root Diagnostics

on:
  push:
    branches:
      - diag/xbox-canonical-runtime-roots

permissions:
  contents: write

jobs:
  transform:
    if: ${{ !contains(github.event.head_commit.message, '[xbox-root-diag]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add passive Xbox root diagnostics
        run: python tools/add_xbox_runtime_root_diagnostics.py
      - name: Commit diagnostics
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No diagnostic changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/clean_pause_native.cpp
          git commit -m "diag: log Xbox canonical runtime root evidence [xbox-root-diag]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
