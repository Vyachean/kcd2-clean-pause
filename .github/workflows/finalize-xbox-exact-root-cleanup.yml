name: Finalize Xbox Exact Root Cleanup

on:
  push:
    branches:
      - refactor/unified-runtime-capabilities

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[xbox-exact-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove final legacy helper and refresh contracts
        run: python tools/finalize_xbox_exact_root_cleanup.py
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/clean_pause_native.cpp tests/test_runtime_profile_contract.py
          git commit -m "refactor: remove final Xbox legacy discovery helper [xbox-exact-cleanup]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
