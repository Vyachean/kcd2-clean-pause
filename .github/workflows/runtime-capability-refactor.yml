name: Runtime Capability Refactor

on:
  push:
    branches:
      - refactor/unified-runtime-capabilities

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-capabilities]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime capability refactor
        run: python tools/refactor_runtime_capabilities.py

      - name: Commit refactor when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No refactor changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/kcd2_runtime_profile.cpp native/src/clean_pause_native.cpp native/tests/runtime_profile_tests.cpp tests tools/validate_native_contract.py
          git commit -m "refactor: make runtime behavior capability-driven [runtime-capabilities]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
