name: Apply full-mod review corrections

on:
  push:
    branches:
      - fix/instant-clean-pause-hud
    paths:
      - tools/apply_full_mod_review.py
      - .github/workflows/apply-full-mod-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instant-clean-pause-hud
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed corrections
        run: python tools/apply_full_mod_review.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Validate native contract
        run: python tools/validate_native_contract.py
      - name: Configure x64 Release
        run: cmake -S native -B native/build -A x64
      - name: Build x64 Release
        run: cmake --build native/build --config Release --parallel
      - name: Commit tested runtime/test corrections
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/clean_pause_native.cpp native/src/clean_pause_bubbles.cpp native/src/clean_pause_hud_mask.h native/CMakeLists.txt tests/test_hud_mask_transaction_contract.py tests/test_bubble_contract.py tests/test_dual_package_contract.py tools/validate_native_contract.py
          git diff --cached --quiet; if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "fix: close full-mod review safety gaps"
          git push origin HEAD:fix/instant-clean-pause-hud

# release.yml and validate.yml are deliberately applied through the GitHub connector;
# the Actions GITHUB_TOKEN cannot update workflow files.
