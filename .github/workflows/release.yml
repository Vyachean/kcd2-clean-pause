name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - .github/workflows/release.yml
    tags:
      - "v*"
  pull_request:
    paths:
      - VERSION
      - .github/workflows/release.yml
      - native/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      asset: ${{ steps.package.outputs.asset }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid VERSION: $version"
          }

          $expectedTag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version"
            }
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = $expectedTag
          }

          $prerelease = if ($version.Contains("-")) { "true" } else { "false" }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$prerelease" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release version: $version"
          Write-Host "Release tag: $tag"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source contracts
        shell: python
        run: |
          from pathlib import Path
          import unittest

          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.discover("tests")
          )
          if not result.wasSuccessful():
              raise SystemExit(1)

          native = Path("native/src/clean_pause_native.cpp").read_text(encoding="utf-8")
          abi = Path("native/src/kcd2_abi.h").read_text(encoding="utf-8")
          forbidden = (
              "Game.PauseGame",
              "ActionMapManager.InitActionMaps(",
              "ActionMapManager.LoadFromXML(",
              "Player.OnAction =",
          )
          for needle in forbidden:
              if needle in native:
                  raise SystemExit(f"Forbidden native runtime dependency: {needle}")
          if "kGameFrameworkPauseGameSlot = 13" not in abi:
              raise SystemExit("KCD2 1.5.6 native PauseGame slot contract changed")
          if "ValidateObjectVtable(value.gameFramework, {kGameFrameworkPauseGameSlot})" not in native:
              raise SystemExit("Native runtime no longer validates PauseGame before hook installation")

      - name: Configure x64 Release
        run: cmake -S native -B native/build -A x64

      - name: Build x64 Release
        run: cmake --build native/build --config Release --parallel

      - name: Validate and package native DLL
        id: package
        shell: pwsh
        run: |
          $dll = "native/build/Release/version.dll"
          if (-not (Test-Path $dll)) { throw "Missing $dll" }
          if ((Get-Item $dll).Length -lt 10240) { throw "version.dll is unexpectedly small" }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $dumpbin = Get-ChildItem (Join-Path $vs "VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe") |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found" }

          $exports = & $dumpbin /nologo /exports $dll | Out-String
          foreach ($name in @("GetFileVersionInfoW", "GetFileVersionInfoSizeW", "VerQueryValueW")) {
            if ($exports -notmatch [regex]::Escape($name)) {
              throw "version.dll proxy export missing: $name"
            }
          }

          $deps = & $dumpbin /nologo /dependents $dll | Out-String
          if ($deps -match "VCRUNTIME[0-9]+\.dll" -or $deps -match "MSVCP[0-9]+\.dll") {
            throw "Release DLL unexpectedly depends on dynamic MSVC runtime"
          }

          New-Item -ItemType Directory -Force release/stage | Out-Null
          Copy-Item $dll release/stage/version.dll
          Copy-Item native/INSTALL.txt release/stage/INSTALL.txt

          $asset = "kcd2-clean-pause-${{ steps.meta.outputs.tag }}.zip"
          $assetPath = "release/$asset"
          Compress-Archive -Path release/stage/* -DestinationPath $assetPath -CompressionLevel Optimal

          $hash = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content release/SHA256SUMS.txt -Encoding ascii -NoNewline
          "asset=$asset" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Packaged $asset ($((Get-Item $assetPath).Length) bytes)"

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.tag }}
          path: |
            release/${{ steps.package.outputs.asset }}
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: release

      - name: Verify downloaded release artifact
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test -f "${{ needs.build.outputs.asset }}"
          test -f SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          unzip -t "${{ needs.build.outputs.asset }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ASSET: ${{ needs.build.outputs.asset }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          args=(
            "$TAG"
            "release/$ASSET"
            "release/SHA256SUMS.txt"
            --generate-notes
            --title "KCD2 Clean Pause $TAG"
          )

          if [[ -n "$remote_tag_sha" ]]; then
            if [[ "$remote_tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $TAG points to $remote_tag_sha, expected $GITHUB_SHA" >&2
              exit 1
            fi
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
