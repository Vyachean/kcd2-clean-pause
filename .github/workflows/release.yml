name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - native/**
      - tools/validate_native_contract.py
      - docs/RELEASE_NOTES.md
      - .github/workflows/release.yml
      - THIRD_PARTY_NOTICES.txt
    tags: ["v*"]
  pull_request:
    paths:
      - VERSION
      - native/**
      - tools/validate_native_contract.py
      - docs/RELEASE_NOTES.md
      - .github/workflows/release.yml
      - THIRD_PARTY_NOTICES.txt
  workflow_dispatch:

permissions:
  contents: write

env:
  ULTIMATE_ASI_LOADER_VERSION: v9.7.4
  ULTIMATE_ASI_LOADER_COMMIT: 6b440669144c4a0bef5718ab155df160d231cd42
  ULTIMATE_ASI_LOADER_ASSET: Ultimate-ASI-Loader_x64.zip
  ULTIMATE_ASI_LOADER_SHA256: 8272d83b2692662098746f2d0ad0e2d85f3c8358ab1d63f75fbe835c2c8135fd

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      asi_asset: ${{ steps.package.outputs.asi_asset }}
      version_asset: ${{ steps.package.outputs.version_asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$') {
            throw "Invalid VERSION: $version. Expected SemVer X.Y.Z or X.Y.Z-(alpha|beta|rc).N"
          }
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $expectedTag }
          $prerelease = if ($version.Contains("-")) { "true" } else { "false" }
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$prerelease" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Validate stable native contract
        run: python tools/validate_native_contract.py
      - name: Configure x64 Release
        run: cmake -S native -B native/build -A x64
      - name: Build x64 Release
        run: cmake --build native/build --config Release --parallel
      - name: Validate and package both native editions
        id: package
        shell: pwsh
        run: |
          $versionDll = "native/build/Release/version.dll"
          $asi = "native/build/Release/KCD2CleanPause.asi"
          foreach ($artifact in @($versionDll, $asi)) {
            if (-not (Test-Path $artifact)) { throw "Missing $artifact" }
            if ((Get-Item $artifact).Length -lt 10240) { throw "$artifact is unexpectedly small" }
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $dumpbin = Get-ChildItem (Join-Path $vs "VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe") | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin.exe not found" }

          $exports = & $dumpbin /nologo /exports $versionDll | Out-String
          $expectedExports = @(
            "GetFileVersionInfoA", "GetFileVersionInfoByHandle", "GetFileVersionInfoExA",
            "GetFileVersionInfoExW", "GetFileVersionInfoSizeA", "GetFileVersionInfoSizeExA",
            "GetFileVersionInfoSizeExW", "GetFileVersionInfoSizeW", "GetFileVersionInfoW",
            "VerFindFileA", "VerFindFileW", "VerInstallFileA", "VerInstallFileW",
            "VerLanguageNameA", "VerLanguageNameW", "VerQueryValueA", "VerQueryValueW"
          )
          foreach ($name in $expectedExports) {
            if ($exports -notmatch [regex]::Escape($name)) { throw "version.dll proxy export missing: $name" }
          }

          foreach ($artifact in @($versionDll, $asi)) {
            $headers = & $dumpbin /nologo /headers $artifact | Out-String
            if ($headers -notmatch "machine \(x64\)") { throw "$artifact is not an x64 image" }
            $deps = & $dumpbin /nologo /dependents $artifact | Out-String
            if ($deps -match "VCRUNTIME[0-9]+\.dll" -or $deps -match "MSVCP[0-9]+\.dll") {
              throw "$artifact unexpectedly depends on dynamic MSVC runtime"
            }
          }

          # The supported ASI package includes the exact upstream loader used for retail
          # acceptance. Pin the tagged release and verify GitHub's published asset digest
          # before extracting anything, so a mutable/latest download can never silently
          # change a Clean Pause release.
          $upstreamRoot = "release/upstream"
          New-Item -ItemType Directory -Force -Path $upstreamRoot | Out-Null
          $loaderArchive = Join-Path $upstreamRoot $env:ULTIMATE_ASI_LOADER_ASSET
          $loaderUrl = "https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/$env:ULTIMATE_ASI_LOADER_VERSION/$env:ULTIMATE_ASI_LOADER_ASSET"
          Invoke-WebRequest -Uri $loaderUrl -OutFile $loaderArchive
          $loaderArchiveHash = (Get-FileHash $loaderArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($loaderArchiveHash -ne $env:ULTIMATE_ASI_LOADER_SHA256) {
            throw "Ultimate ASI Loader archive hash mismatch: expected $env:ULTIMATE_ASI_LOADER_SHA256, got $loaderArchiveHash"
          }

          $loaderExtract = Join-Path $upstreamRoot "ultimate-asi-loader"
          Expand-Archive -Path $loaderArchive -DestinationPath $loaderExtract -Force
          $loaderCandidates = @(Get-ChildItem $loaderExtract -Recurse -File -Filter "dinput8.dll")
          if ($loaderCandidates.Count -ne 1) {
            throw "Expected exactly one upstream dinput8.dll, found $($loaderCandidates.Count)"
          }
          $loader = $loaderCandidates[0].FullName
          $loaderHeaders = & $dumpbin /nologo /headers $loader | Out-String
          if ($loaderHeaders -notmatch "machine \(x64\)") { throw "Bundled upstream dinput8.dll is not an x64 image" }
          $loaderHash = (Get-FileHash $loader -Algorithm SHA256).Hash.ToLowerInvariant()

          New-Item -ItemType Directory -Force -Path release/asi | Out-Null
          New-Item -ItemType Directory -Force -Path release/version-dll | Out-Null
          Copy-Item $asi release/asi/KCD2CleanPause.asi
          Copy-Item $loader release/asi/dinput8.dll
          Copy-Item native/INSTALL_ASI.txt release/asi/INSTALL.txt
          Copy-Item THIRD_PARTY_NOTICES.txt release/asi/THIRD_PARTY_NOTICES.txt
          Copy-Item $versionDll release/version-dll/version.dll
          Copy-Item native/INSTALL_VERSION_DLL.txt release/version-dll/INSTALL.txt
          Copy-Item THIRD_PARTY_NOTICES.txt release/version-dll/THIRD_PARTY_NOTICES.txt

          $loaderLicenseUrl = "https://raw.githubusercontent.com/ThirteenAG/Ultimate-ASI-Loader/$env:ULTIMATE_ASI_LOADER_COMMIT/license"
          Invoke-WebRequest -Uri $loaderLicenseUrl -OutFile release/asi/ULTIMATE_ASI_LOADER_LICENSE.txt
          $loaderLicense = Get-Content release/asi/ULTIMATE_ASI_LOADER_LICENSE.txt -Raw
          if ($loaderLicense -notmatch "MIT License" -or $loaderLicense -notmatch "ThirteenAG") {
            throw "Unexpected Ultimate ASI Loader license content"
          }

          @(
            "Ultimate ASI Loader",
            "Version: $env:ULTIMATE_ASI_LOADER_VERSION",
            "Source commit: $env:ULTIMATE_ASI_LOADER_COMMIT",
            "Source release: https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/tag/$env:ULTIMATE_ASI_LOADER_VERSION",
            "Upstream asset: $env:ULTIMATE_ASI_LOADER_ASSET",
            "Upstream asset SHA-256: $loaderArchiveHash",
            "Bundled file: dinput8.dll",
            "Bundled file SHA-256: $loaderHash",
            "License: MIT (see ULTIMATE_ASI_LOADER_LICENSE.txt)"
          ) | Set-Content release/asi/ASI_LOADER_SOURCE.txt -Encoding ascii

          $asiAsset = "kcd2-clean-pause-${{ steps.meta.outputs.tag }}-asi.zip"
          $versionAsset = "kcd2-clean-pause-${{ steps.meta.outputs.tag }}-version-dll.zip"
          Compress-Archive -Path release/asi/* -DestinationPath "release/$asiAsset" -CompressionLevel Optimal
          Compress-Archive -Path release/version-dll/* -DestinationPath "release/$versionAsset" -CompressionLevel Optimal

          $asiHash = (Get-FileHash "release/$asiAsset" -Algorithm SHA256).Hash.ToLowerInvariant()
          $versionHash = (Get-FileHash "release/$versionAsset" -Algorithm SHA256).Hash.ToLowerInvariant()
          # Public checksums cover only assets we intentionally distribute. The standalone
          # package is still built, packaged and hashed in CI under the current ASI-first
          # edition-publication policy; antivirus/reputation status is not the gate.
          "$asiHash  $asiAsset" | Set-Content release/SHA256SUMS.txt -Encoding ascii
          @(
            "$asiHash  $asiAsset",
            "$versionHash  $versionAsset"
          ) | Set-Content release/CI_SHA256SUMS.txt -Encoding ascii

          "asi_asset=$asiAsset" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version_asset=$versionAsset" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.tag }}
          path: |
            release/${{ steps.package.outputs.asi_asset }}
            release/${{ steps.package.outputs.version_asset }}
            release/SHA256SUMS.txt
            release/CI_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: release
      - name: Verify downloaded release artifacts
        shell: bash
        env:
          ASI_ASSET: ${{ needs.build.outputs.asi_asset }}
          VERSION_ASSET: ${{ needs.build.outputs.version_asset }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c CI_SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          unzip -t "$ASI_ASSET"
          unzip -t "$VERSION_ASSET"
          [[ "$(unzip -Z1 "$ASI_ASSET" | sort)" == $'ASI_LOADER_SOURCE.txt\nINSTALL.txt\nKCD2CleanPause.asi\nTHIRD_PARTY_NOTICES.txt\nULTIMATE_ASI_LOADER_LICENSE.txt\ndinput8.dll' ]]
          [[ "$(unzip -Z1 "$VERSION_ASSET" | sort)" == $'INSTALL.txt\nTHIRD_PARTY_NOTICES.txt\nversion.dll' ]]
      - name: Ensure immutable release tag
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [[ -n "$remote_tag_sha" ]]; then
            if [[ "$remote_tag_sha" == "$GITHUB_SHA" ]]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "Tag $TAG already belongs to $remote_tag_sha; this main commit does not create another release for the same VERSION."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Tag points to $remote_tag_sha, workflow commit is $GITHUB_SHA" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release publication requires the matching tag or a main-branch release-preparation run" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        if: steps.release_tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ASI_ASSET: ${{ needs.build.outputs.asi_asset }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          [[ "$remote_tag_sha" == "$GITHUB_SHA" ]] || { echo "Tag points to $remote_tag_sha, workflow commit is $GITHUB_SHA" >&2; exit 1; }
          # Standalone version.dll remains non-public under the current ASI-first edition policy.
          args=("$TAG" "release/$ASI_ASSET" "release/SHA256SUMS.txt" --title "KCD2 Clean Pause $TAG" --notes-file docs/RELEASE_NOTES.md --verify-tag)
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          gh release create "${args[@]}"
