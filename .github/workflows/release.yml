name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi

          expected_tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          else
            tag="$expected_tag"
          fi

          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "Release version: $version"
          echo "Release tag: $tag"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate source
        run: |
          luac5.1 -p src/Scripts/Mods/clean_pause.lua
          python -m unittest discover -s tests -v

      - name: Build release package
        run: python tools/build_release.py

      - name: Name and validate release assets
        shell: bash
        run: |
          set -euo pipefail
          asset="kcd2-clean-pause-${TAG}.zip"
          mv release/kcd2-clean-pause-xbox-1.5.6-test.zip "release/$asset"
          unzip -t "release/$asset"
          (cd release && sha256sum "$asset" > SHA256SUMS.txt)
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: |
            release/${{ env.ASSET }}
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi

          remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          args=(
            "$TAG"
            "release/$ASSET"
            "release/SHA256SUMS.txt"
            --generate-notes
            --title "KCD2 Clean Pause $TAG"
          )

          if [[ -n "$remote_tag_sha" ]]; then
            if [[ "$remote_tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $TAG points to $remote_tag_sha, expected $GITHUB_SHA" >&2
              exit 1
            fi
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
