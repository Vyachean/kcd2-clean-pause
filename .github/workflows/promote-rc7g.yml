name: Materialize RC7g production source

on:
  push:
    branches:
      - candidate/rc7-render-suppression
    paths:
      - .github/workflows/promote-rc7g.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: candidate/rc7-render-suppression
          fetch-depth: 0

      - name: Generate exact retail-proven source
        shell: bash
        run: |
          set -euo pipefail
          python native/candidate/rc7/generate_candidate_v7.py \
            native/candidate/rc7/clean_pause_candidate.cpp \
            native/src/clean_pause_native.cpp

          python - <<'PY'
          from pathlib import Path
          path = Path('native/src/clean_pause_native.cpp')
          source = path.read_text(encoding='utf-8')
          replacements = {
              'rc7g borrowed-movieclip HUD candidate active': 'KCD2 Clean Pause v0.1.0 active',
              'native bootstrap started; target=KCD2 1.5.6 Windows retail; rc7g borrowed-movieclip HUD candidate':
                  'native bootstrap started; target=KCD2 1.5.6 Windows retail; KCD2 Clean Pause v0.1.0',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'missing expected rc7g runtime marker: {old}')
              source = source.replace(old, new)

          required = (
              'KCD2 Clean Pause v0.1.0 active',
              'HookMenuRender',
              'HookHudUpdate',
              'CaptureHudVisibilitySnapshot',
              'RestoreHudVisibilitySnapshot',
              'ShouldFreezeHudFunction',
              'ClearSubtitles',
              'HideNarrativeSubtitles',
              'ReplayVanillaPauseToggle',
              'KeyId::XiB',
          )
          for needle in required:
              if needle not in source:
                  raise SystemExit(f'materialized source missing: {needle}')

          forbidden = (
              'ActionMapManager.IsFilterEnabled("only_ui")',
              'SetMenuVisible(false)',
              'HideVerifiedVanillaPause(',
              'ReleaseFlashVariable',
              'snapshot.clip',
              'rc7g borrowed-movieclip HUD candidate active',
          )
          for needle in forbidden:
              if needle in source:
                  raise SystemExit(f'materialized source retained rejected/candidate path: {needle}')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit materialized production source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- native/src/clean_pause_native.cpp; then
            echo 'Production source already matches rc7g.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/clean_pause_native.cpp
          git commit -m 'feat(native): promote retail-proven clean pause implementation'
          git push origin HEAD:candidate/rc7-render-suppression
