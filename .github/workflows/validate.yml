name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Historical Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          luac5.1 -p src/Scripts/Mods/clean_pause.lua

      - name: Permanent input-safety constraints
        shell: python
        run: |
          from pathlib import Path

          sources = [
              Path("src/Scripts/Mods/clean_pause.lua"),
              Path("native/src/clean_pause_native.cpp"),
          ]
          text = "\n".join(path.read_text(encoding="utf-8") for path in sources)
          forbidden = (
              "ActionMapManager.InitActionMaps(",
              "ActionMapManager.LoadFromXML(",
              "Player.OnAction =",
              "System.ExecuteCommand(\"bind ",
              "System.ExecuteCommand('bind ",
          )
          for needle in forbidden:
              if needle in text:
                  raise SystemExit(f"Forbidden input mutation found: {needle}")

          native = Path("native/src/clean_pause_native.cpp").read_text(encoding="utf-8")
          abi = Path("native/src/kcd2_abi.h").read_text(encoding="utf-8")
          if "Game.PauseGame" in native:
              raise SystemExit("Native runtime must not depend on unavailable retail Lua Game.PauseGame")
          if "kGameFrameworkPauseGameSlot = 13" not in abi:
              raise SystemExit("Pinned KCD2 1.5.6 IGameFramework PauseGame slot changed")
          if "PauseGameFn" not in abi or "g_gameFramework" not in native:
              raise SystemExit("Direct native pause contract is missing")
          if "ValidateObjectVtable(value.gameFramework, {kGameFrameworkPauseGameSlot})" not in native:
              raise SystemExit("Runtime environment does not validate the pause vfunc before hooking")

          print("Native pause and input safety contracts passed")

  native-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure x64 Release
        run: cmake -S native -B native/build -A x64

      - name: Build x64 Release
        run: cmake --build native/build --config Release --parallel

      - name: Validate version proxy artifact
        shell: pwsh
        run: |
          $dll = "native/build/Release/version.dll"
          if (-not (Test-Path $dll)) { throw "Missing $dll" }
          if ((Get-Item $dll).Length -lt 10240) { throw "version.dll is unexpectedly small" }

          $exports = & dumpbin /nologo /exports $dll | Out-String
          foreach ($name in @("GetFileVersionInfoW", "GetFileVersionInfoSizeW", "VerQueryValueW")) {
            if ($exports -notmatch [regex]::Escape($name)) {
              throw "version.dll proxy export missing: $name"
            }
          }

          $deps = & dumpbin /nologo /dependents $dll | Out-String
          if ($deps -match "VCRUNTIME[0-9]+\.dll" -or $deps -match "MSVCP[0-9]+\.dll") {
            throw "Release DLL unexpectedly depends on dynamic MSVC runtime"
          }

          Write-Host "Native version.dll validated: $((Get-Item $dll).Length) bytes"

      - name: Upload native CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-version-dll
          path: native/build/Release/version.dll
          if-no-files-found: error
          retention-days: 7
