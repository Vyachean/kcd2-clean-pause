name: Fix Xbox Diagnostic Compile

on:
  push:
    branches:
      - diag/xbox-canonical-runtime-roots

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[xbox-diag-compile]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Xbox diagnostic compile block
        run: python tools/fix_xbox_diag_compile.py
      - name: Commit compile fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No compile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/clean_pause_native.cpp
          git commit -m "diag: fix Xbox runtime root diagnostic build [xbox-diag-compile]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
